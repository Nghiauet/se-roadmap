services:
  se-roadmap:
    build:
      context: .
      dockerfile: Dockerfile
    image: se-roadmap:latest
    container_name: se-roadmap
    restart: unless-stopped
    ports:
      - "127.0.0.1:46402:3000"
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
